type User @table {
  displayName: String!
  email: String!
  createdAt: Timestamp!
  photoUrl: String
  bio: String
  role: String
}

type Course @table {
  title: String!
  description: String!
  createdAt: Timestamp!
  instructor: User
  imageUrl: String
  category: String
  difficulty: String
  price: Float
}

type Enrollment @table(key: ["user", "course"]) {
  user: User!
  course: Course!
  enrolledAt: Timestamp!
  progress: Int!
  completedAt: Timestamp
  grade: Float
}

type Lesson @table {
  title: String!
  content: String!
  orderIndex: Int!
  course: Course
  videoUrl: String
  duration: Int
}

type Quiz @table {
  title: String!
  passingScore: Int!
  lesson: Lesson
  description: String
  numberOfQuestions: Int
}

type Question @table {
  text: String!
  type: String!
  correctAnswer: String!
  quiz: Quiz
  options: [String]
}

type Assignment @table {
  title: String!
  description: String!
  dueDate: Timestamp!
  course: Course
  maxScore: Int
}